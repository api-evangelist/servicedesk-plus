aid: servicedesk-plus
name: ManageEngine ServiceDesk Plus
description: >-
  ManageEngine ServiceDesk Plus is a comprehensive IT service management
  (ITSM) suite with incident, problem, change, release, and asset management
  modules, plus a CMDB and project management. ServiceDesk Plus is available
  as cloud (SaaS) or on-premises, and exposes a REST API for integrating
  external systems with requests, problems, changes, assets, and the CMDB.
